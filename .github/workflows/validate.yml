name: Validate release content
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_release.py
      - run: python3 -B -m unittest discover -s skills/baocanmou-restaurant-slogan/tests -v
      - run: python3 -B -m unittest discover -s scripts -p "test_*.py" -v
