<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="600" viewBox="0 0 1440 600"><title>Restaurant brief to ten candidates to three recommendations</title><rect width="1440" height="600" fill="#F6F0E3"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" fill="#202320"><text x="64" y="82" font-size="26">包参谋 / BaoCanMou</text><text x="64" y="150" font-size="43" font-weight="700">先理解这一餐，再写这句话。</text><text x="64" y="196" font-size="23">Start with the meal. Then write the line.</text></g><g fill="none" stroke="#D5412D" stroke-width="3"><path d="M428 340H497L478 325M497 340L478 355M925 340H994L975 325M994 340L975 355"/></g><g fill="#FFFFFF" stroke="#DED7CB"><rect x="64" y="246" width="350" height="234" rx="8"/><rect x="512" y="246" width="398" height="234" rx="8"/><rect x="1008" y="246" width="368" height="234" rx="8"/></g><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><g fill="#D5412D" font-size="34" font-weight="700"><text x="88" y="301">01 / 餐饮资料</text><text x="536" y="301">02 / 十种方法</text><text x="1032" y="301">03 / 三条推荐</text></g><g fill="#202320" font-size="23"><text x="88" y="347">品类 · 顾客 · 场景 · 事实</text><text x="88" y="392">Restaurant brief</text><text x="88" y="434" font-size="18">Food, audience, occasion, facts</text><text x="536" y="347">各写一条 · 核对 · 比较</text><text x="536" y="392">Ten distinct candidates</text><text x="536" y="434" font-size="18">Apply, check, compare</text><text x="1032" y="347">主推 · 备选 · 具体取舍</text><text x="1032" y="392">Three recommendations</text><text x="1032" y="434" font-size="18">Lead, alternatives, tradeoffs</text></g><text x="64" y="552" fill="#6C6C65" font-size="20">餐饮事实与方法前提分别检查 / Check restaurant facts and method prerequisites separately.</text></g></svg>